name: Check Tokei MoonBit port

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
      - name: Update Mooncakes registry
        run: moon update
      - name: Verify language table, build, tests and CLI
        run: python tools/verify_release.py
      - name: Measure MoonBit test coverage
        if: runner.os == 'Linux'
        run: |
          moon test --target native --enable-coverage
          moon coverage report -f summary
      - name: Check Mooncakes package without publishing
        if: runner.os == 'Linux'
        run: moon publish --dry-run
